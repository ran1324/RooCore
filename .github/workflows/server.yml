name: Native server

on:
  push:
    paths: ['server/control/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/control/**', '.github/workflows/server.yml']

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install isolated broker test tools
        run: sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients
      - name: Install locked dependencies
        run: python -m pip install -r server/control/requirements.lock
      - name: Test authentication, mail, maps and broker permissions
        working-directory: server/control
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Check dependency consistency
        run: python -m pip check
