name: RooCore firmware and navigation
on:
  push:
    paths: ['lib/RoombaOI/**', 'lib/RooNavigation/**', 'firmware/xiao/**', 'navigation/**', 'ros2/**', 'tests/**', 'docs/oi-map.json', '.github/workflows/roomba-oi.yml']
  pull_request:
    paths: ['lib/RoombaOI/**', 'lib/RooNavigation/**', 'firmware/xiao/**', 'navigation/**', 'ros2/**', 'tests/**', 'docs/oi-map.json', '.github/workflows/roomba-oi.yml']
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sh tests/run.sh
      - run: python3 -m unittest discover -s tests -v
      - run: clang++ -std=c++11 -Ifirmware/include tests/core_test.cpp -o /tmp/recorder-test && /tmp/recorder-test
  xiao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.12-${{ runner.os }}-${{ runner.arch }}
      - run: arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - run: sh tests/build_xiao.sh

  ros2:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: apt-get update && apt-get install -y ros-jazzy-nav2-msgs ros-jazzy-tf2-ros
      - shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2 --packages-select roocore_bridge
          source install/setup.bash
          python3 -c 'import roocore_bridge.bridge, roocore_bridge.cleaner'
