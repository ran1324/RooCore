<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470"><rect width="1100" height="470" fill="white" /><text x="35" y="40" fill="#172b45" font-family="Arial,sans-serif" font-size="27">D36V28F5 #3782: conditional hardware cutoff</text><text x="35" y="78" fill="#172b45" font-family="Arial,sans-serif" font-size="19">Prepare with all power removed. Thresholds calculated; not measured.</text><text x="35" y="197" fill="#172b45" font-family="Arial,sans-serif" font-size="21">U3 P2 VIN</text><line x1="180" y1="190" x2="245" y2="190" stroke="#172b45" stroke-width="3" /><rect x="245" y="173" width="110" height="34" fill="white" stroke="#172b45" stroke-width="3" /><text x="245" y="159" fill="#172b45" font-family="Arial,sans-serif" font-size="21">100k internal</text><line x1="355" y1="190" x2="450" y2="190" stroke="#172b45" stroke-width="3" /><circle cx="450" cy="190" r="6" fill="#172b45" /><text x="390" y="148" fill="#172b45" font-family="Arial,sans-serif" font-size="21">U3 P1 EN</text><line x1="450" y1="190" x2="510" y2="190" stroke="#172b45" stroke-width="3" /><rect x="510" y="173" width="110" height="34" fill="white" stroke="#172b45" stroke-width="3" /><text x="510" y="159" fill="#172b45" font-family="Arial,sans-serif" font-size="21">10k (A)</text><line x1="620" y1="190" x2="690" y2="190" stroke="#172b45" stroke-width="3" /><rect x="690" y="173" width="110" height="34" fill="white" stroke="#172b45" stroke-width="3" /><text x="690" y="159" fill="#172b45" font-family="Arial,sans-serif" font-size="21">1k (B)</text><line x1="800" y1="190" x2="890" y2="190" stroke="#172b45" stroke-width="3" /><text x="865" y="242" fill="#172b45" font-family="Arial,sans-serif" font-size="21">U3 P3/P4 GND</text><line x1="890" y1="190" x2="890" y2="270" stroke="#172b45" stroke-width="3" /><line x1="867" y1="270" x2="913" y2="270" stroke="#172b45" stroke-width="3" /><line x1="875" y1="280" x2="905" y2="280" stroke="#172b45" stroke-width="3" /><line x1="883" y1="290" x2="897" y2="290" stroke="#172b45" stroke-width="3" /><text x="35" y="340" fill="#172b45" font-family="Arial,sans-serif" font-size="21">A + B = 11k. Each: 1%, 0.25W minimum; no polarity.</text><text x="35" y="380" fill="#172b45" font-family="Arial,sans-serif" font-size="21">Nominal VIN: OFF 12.11V / ON 13.62V. Full tolerance UNKNOWN.</text><text x="35" y="420" fill="#172b45" font-family="Arial,sans-serif" font-size="21">PG unused. No GPIO connection. Internal 100k is already on U3.</text></svg>