<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-label="RooCore harness: module terminal schematic, 13 wires"><rect width="1200" height="930" fill="white" /><text x="600" y="35" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="27">RooCore — schematic of the 13 harness wires</text><text x="600" y="68" fill="#9b342a" text-anchor="middle" font-family="Arial,sans-serif" font-size="20">UNPOWERED • USB disconnected • robot and LiDAR unplugged</text><text x="600" y="99" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">Module pad names, not IC lead numbers. Dots are junctions; crossings without dots are separate.</text><rect x="40" y="150" width="135" height="155" fill="#edf3f8" stroke="#52728c" stroke-width="2" /><text x="107.5" y="247" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">J1 · XT30</text><text x="107.5" y="271" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">LOAD half</text><rect x="300" y="150" width="250" height="245" fill="#edf3f8" stroke="#52728c" stroke-width="2" /><text x="425.0" y="337" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">U3 · D36V28F5</text><text x="425.0" y="361" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">5V fixed</text><text x="425.0" y="385" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">GND 1 = GND 2</text><rect x="800" y="150" width="180" height="245" fill="#edf3f8" stroke="#52728c" stroke-width="2" /><text x="890.0" y="337" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">S1 · Pololu 2810</text><text x="890.0" y="361" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">slide OFF</text><rect x="1080" y="150" width="100" height="280" fill="#edf3f8" stroke="#52728c" stroke-width="2" /><text x="1130.0" y="372" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">J2 · GH</text><text x="1130.0" y="396" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">cable</text><rect x="300" y="440" width="250" height="200" fill="#edf3f8" stroke="#52728c" stroke-width="2" /><text x="425.0" y="582" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">U4 · XIAO</text><text x="425.0" y="606" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="17">ESP32S3</text><text x="165" y="190" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">+</text><text x="165" y="230" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">−</text><text x="310" y="190" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">VIN</text><text x="310" y="230" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">GND 1</text><text x="540" y="250" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">GND 2</text><text x="540" y="190" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">VOUT</text><text x="810" y="190" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">VIN</text><text x="810" y="250" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">GND</text><text x="810" y="310" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">ON</text><text x="970" y="190" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">VOUT</text><text x="540" y="570" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">GND</text><text x="540" y="470" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">5V/VBUS</text><text x="540" y="520" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">D3/GPIO4</text><text x="310" y="490" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">D4/GPIO5</text><text x="310" y="535" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">D5/GPIO6</text><text x="1090" y="190" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">VCC</text><text x="1090" y="280" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">GND</text><text x="1090" y="235" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">TX</text><text x="1090" y="325" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">RX</text><g data-wire="1" data-from="XT30 LOAD +" data-to="U3 VIN" data-net="BAT_BRANCH_PLUS"><polyline points="175,185 300,185" fill="none" stroke="white" stroke-width="8" /><polyline points="175,185 300,185" fill="none" stroke="#c82e30" stroke-width="3" /></g><text x="230" y="170" fill="#c82e30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">1</text><g data-wire="2" data-from="XT30 LOAD −" data-to="U3 GND 1" data-net="GND"><polyline points="175,225 300,225" fill="none" stroke="white" stroke-width="8" /><polyline points="175,225 300,225" fill="none" stroke="#26384a" stroke-width="3" /></g><text x="230" y="215" fill="#26384a" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">2</text><g data-wire="3" data-from="U3 VOUT" data-to="5V BUS" data-net="5V"><polyline points="550,185 660,185" fill="none" stroke="white" stroke-width="8" /><polyline points="550,185 660,185" fill="none" stroke="#c82e30" stroke-width="3" /></g><text x="600" y="170" fill="#c82e30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">3</text><g data-wire="4" data-from="U3 GND 2" data-to="GND BUS" data-net="GND"><polyline points="550,245 600,245 600,620" fill="none" stroke="white" stroke-width="8" /><polyline points="550,245 600,245 600,620" fill="none" stroke="#26384a" stroke-width="3" /></g><text x="585" y="380" fill="#26384a" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">4</text><g data-wire="5" data-from="5V BUS" data-to="S1 VIN" data-net="5V"><polyline points="660,185 800,185" fill="none" stroke="white" stroke-width="8" /><polyline points="660,185 800,185" fill="none" stroke="#c82e30" stroke-width="3" /></g><text x="735" y="170" fill="#c82e30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">5</text><g data-wire="6" data-from="GND BUS" data-to="S1 GND" data-net="GND"><polyline points="600,620 760,620 760,245 800,245" fill="none" stroke="white" stroke-width="8" /><polyline points="600,620 760,620 760,245 800,245" fill="none" stroke="#26384a" stroke-width="3" /></g><text x="777" y="231" fill="#26384a" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">6</text><g data-wire="7" data-from="GND BUS" data-to="XIAO GND" data-net="GND"><polyline points="600,620 600,565 550,565" fill="none" stroke="white" stroke-width="8" /><polyline points="600,620 600,565 550,565" fill="none" stroke="#26384a" stroke-width="3" /></g><text x="577" y="553" fill="#26384a" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">7</text><g data-wire="8" data-from="5V BUS" data-to="XIAO 5V" data-net="5V"><polyline points="660,185 660,465 550,465" fill="none" stroke="white" stroke-width="8" /><polyline points="660,185 660,465 550,465" fill="none" stroke="#c82e30" stroke-width="3" /></g><text x="625" y="449" fill="#c82e30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">8</text><g data-wire="9" data-from="XIAO D3 / GPIO4" data-to="S1 ON" data-net="LIDAR_ENABLE"><polyline points="550,515 700,515 700,305 800,305" fill="none" stroke="white" stroke-width="8" /><polyline points="550,515 700,515 700,305 800,305" fill="none" stroke="#006fc4" stroke-width="3" /></g><text x="723" y="290" fill="#006fc4" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">9</text><g data-wire="10" data-from="S1 VOUT" data-to="LiDAR cable VCC" data-net="5V_LIDAR_SWITCHED"><polyline points="980,185 1080,185" fill="none" stroke="white" stroke-width="8" /><polyline points="980,185 1080,185" fill="none" stroke="#c82e30" stroke-width="3" /></g><text x="1030" y="170" fill="#c82e30" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">10</text><g data-wire="11" data-from="GND BUS" data-to="LiDAR cable GND" data-net="GND"><polyline points="600,620 1020,620 1020,275 1080,275" fill="none" stroke="white" stroke-width="8" /><polyline points="600,620 1020,620 1020,275 1080,275" fill="none" stroke="#26384a" stroke-width="3" /></g><text x="1050" y="261" fill="#26384a" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">11</text><g data-wire="12" data-from="XIAO D4 / GPIO5" data-to="LiDAR cable RX" data-net="MCU_TX_LIDAR_RX"><polyline points="300,485 220,485 220,675 1050,675 1050,320 1080,320" fill="none" stroke="white" stroke-width="8" /><polyline points="300,485 220,485 220,675 1050,675 1050,320 1080,320" fill="none" stroke="#007b54" stroke-width="3" /></g><text x="245" y="470" fill="#007b54" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">12</text><g data-wire="13" data-from="LiDAR cable TX" data-to="XIAO D5 / GPIO6" data-net="LIDAR_TX_MCU_RX"><polyline points="1080,230 1010,230 1010,700 190,700 190,530 300,530" fill="none" stroke="white" stroke-width="8" /><polyline points="1080,230 1010,230 1010,700 190,700 190,530 300,530" fill="none" stroke="#8545a4" stroke-width="3" /></g><text x="245" y="518" fill="#8545a4" text-anchor="middle" font-family="Arial,sans-serif" font-size="16">13</text><circle cx="660" cy="185" r="5" fill="#c82e30" /><circle cx="600" cy="620" r="5" fill="#26384a" /><circle cx="600" cy="565" r="5" fill="#26384a" /><circle cx="760" cy="620" r="5" fill="#26384a" /><text x="670" y="135" fill="#c82e30" text-anchor="start" font-family="Arial,sans-serif" font-size="18">5V BUS</text><text x="850" y="655" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">GND BUS — common return</text><text x="310" y="280" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">EN</text><path d="M300 275H282M277 270l10 10M277 280l10 -10" fill="none" stroke="#7d4d50" stroke-width="2" /><text x="268" y="280" fill="#7d4d50" text-anchor="end" font-family="Arial,sans-serif" font-size="13">NC</text><text x="310" y="310" fill="#17314a" text-anchor="start" font-family="Arial,sans-serif" font-size="16">PG</text><path d="M300 305H282M277 300l10 10M277 310l10 -10" fill="none" stroke="#7d4d50" stroke-width="2" /><text x="268" y="310" fill="#7d4d50" text-anchor="end" font-family="Arial,sans-serif" font-size="13">NC</text><text x="970" y="290" fill="#17314a" text-anchor="end" font-family="Arial,sans-serif" font-size="16">SW</text><path d="M980 285H998M993 280l10 10M993 290l10 -10" fill="none" stroke="#7d4d50" stroke-width="2" /><text x="998" y="271" fill="#7d4d50" text-anchor="middle" font-family="Arial,sans-serif" font-size="13">NC</text><text x="600" y="745" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">UART: D4 TX → sensor RX; sensor TX → D5 RX. 3.3V, 230400, 8N1.</text><text x="600" y="780" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">OFF order: UART detached → D4 LOW / D5 input pulldown → D3 LOW.</text><text x="600" y="815" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">NC: XIAO 3V3 / BAT / D0–D2 / D6–D10 / USB; S1 external switch pads.</text><text x="600" y="850" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">NOYITO: U1 planned for Roomba; U2 spare. Fuse / robot wiring are separate.</text><text x="600" y="900" fill="#17314a" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Software sequencing is required. Read LIDAR_POWER_UART.md; hardware tests are pending.</text></svg>