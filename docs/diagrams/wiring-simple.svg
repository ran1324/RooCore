<path d="M50 770 H1390" stroke="#ddd"/>
<text x="50" y="805" font-size="18" font-weight="400" text-anchor="start" class="">Dots mark connections. Crossings without dots are not connected.</text>
<text x="50" y="839" font-size="18" font-weight="400" text-anchor="start" class="">Roomba and ESP pins are arranged for clarity. Transistor: onsemi 2N3906 pin order; verify your BOJACK part.</text>
<text x="50" y="873" font-size="17" font-weight="400" text-anchor="start" class="">RX uses the internal pull-up. Keep GPIO0 and RST high at boot. Disconnect the programmer before use.</text>
<text x="50" y="911" font-size="16" font-weight="400" text-anchor="start" class="">Use the wiring guide for connector orientation and power details. Hardware validation is pending.</text>
</svg>
