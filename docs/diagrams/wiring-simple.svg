<text x="1105" y="174" font-size="25" font-weight="700" text-anchor="start" class="">ESP-01S</text>
<rect x="570" y="135" width="280" height="180" rx="4" fill="#fafafa" stroke="#72777e" stroke-width="1.5"/>
