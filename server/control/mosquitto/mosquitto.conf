listener 18883 127.0.0.1
allow_anonymous false
password_file /etc/mosquitto/roocore-passwd
acl_file /etc/mosquitto/roocore-acl
# No retained data, offline sessions, commands, or persistent queues in this pilot.
retain_available false
persistence false
max_keepalive 60
max_packet_size 4096
max_inflight_messages 10
max_queued_messages 20
max_connections 20
log_dest stdout
log_type error
log_type warning
connection_messages true
